{% extends "base.html" %}

{% block title %}Update Class | Assignment Tracking App{% endblock %}

{% block content %}

<div class ="main">

    <h1> Update Class</h1>
     <form action="{{ url_for('main.update_class', CID=class_to_update.CID) }}" method="post">

        <label>Title:</label><br>
        <input type="text" name="title" value="{{ class_to_update.Title }}" required><br>

        <label>Professor:</label><br>
        <select name="professor_id" required>
        {% for p in professors %}
            <option value="{{ p.PID }}" {% if p.PID == class_to_update.PID %}selected{% endif %}>{{ p.FullName }}</option>
        {% endfor %}
    </select><br>

    <input type="submit" value="Submit">
</form>
</div>
{% endblock %}
